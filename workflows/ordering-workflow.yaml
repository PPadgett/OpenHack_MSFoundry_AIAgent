apiVersion: foundry.workflows/v1
kind: Workflow
metadata:
  name: crust-ordering-workflow
  displayName: "Crust Ordering Workflow"
  version: "1.0.0"
  description: |
    Pizza ordering workflow - no loops, deterministic state machine.
    Terminal states: success (order submitted), escalation (human handoff), no-order (user exits).

spec:
  # Workflow Configuration
  initial_state: greet
  max_turns: 15  # Auto-escalate if max turns reached
  
  # State Definitions (Declarative, No Loops)
  states:
    # ===== INITIAL STATE =====
    - name: greet
      type: agent_turn
      agent: crust
      prompt_override: |
        Greet the customer warmly. If we have their name in memory, use it.
        Ask what they'd like to order (pizza, sides, drinks, dessert).
        Offer to reorder a past favorite if memory allows.
        Persona at level 3 (default emo intensity).
      transitions:
        - condition: "intent == order"
          next_state: collect_size
        - condition: "intent == browse"
          next_state: menu_browse
        - condition: "intent == check_status"
          next_state: check_order_status
        - condition: "intent == exit"
          next_state: end_no_order
        - condition: "default"
          next_state: clarify_intent
      output_format:
        - emoji_pizza: true
        - lowercase_emo_greeting: true
        - max_lines: 3

    # ===== MENU BROWSING FLOW =====
    - name: menu_browse
      type: agent_turn
      agent: crust
      prompt_override: |
        Call menu_lookup to show available items.
        Display 3-5 popular items or filter by category if customer specified.
        Ask: "Anything catch your eye?"
      transitions:
        - condition: "item_selected == true"
          next_state: collect_size
        - condition: "want_to_start_over == true"
          next_state: greet
        - condition: "exit == true"
          next_state: end_no_order
      guardrails:
        - "Always call menu_lookup; never invent items"
        - "Show real prices from price_calc, not guesses"

    - name: clarify_intent
      type: agent_turn
      agent: crust
      prompt_override: "Ask: 'Did you want to order, check your order status, or something else?'"
      transitions:
        - condition: "intent == order"
          next_state: collect_size
        - condition: "intent == check_status"
          next_state: check_order_status
        - condition: "intent == exit"
          next_state: end_no_order
        - condition: "turn_count >= 2"
          next_state: end_no_order

    # ===== SLOT COLLECTION FLOW =====
    - name: collect_size
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "What size? small, medium, large, or xlarge?"
        Persona at level 2 (minimal emo; focus on clarity).
      transitions:
        - condition: "size_captured == true"
          next_state: collect_crust
        - condition: "size_unclear == true"
          next_state: clarify_size
        - condition: "exit == true"
          next_state: end_no_order
      slot: "size"
      required: true

    - name: clarify_size
      type: agent_turn
      agent: crust
      prompt_override: "Ask again: 'Which size exactly? small, medium, large, or xlarge?'"
      transitions:
        - condition: "size_captured == true"
          next_state: collect_crust
        - condition: "turn_count >= 2 AND size_missing == true"
          next_state: end_escalation
          escalation_reason: "size_collection_stuck"

    - name: collect_crust
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Crust preference? thin, hand-tossed, stuffed-crust, or pan?"
      transitions:
        - condition: "crust_captured == true"
          next_state: collect_sauce
        - condition: "unclear == true"
          next_state: collect_crust
      slot: "crust"
      required: true

    - name: collect_sauce
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Which sauce? red, white, bbq, garlic, or no sauce?"
      transitions:
        - condition: "sauce_captured == true"
          next_state: collect_cheese
      slot: "sauce"
      required: true

    - name: collect_cheese
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Cheese level? light, regular, extra, or none?"
      transitions:
        - condition: "cheese_captured == true"
          next_state: collect_toppings
      slot: "cheese"
      required: true

    - name: collect_toppings
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Any toppings? (list available from menu_lookup or 'no thanks')"
        This is an iterative slot. Loop here until customer says "that's all".
        Persona at level 2; be efficient.
      transitions:
        - condition: "topping_added == true"
          next_state: collect_toppings  # Loop back for another topping
        - condition: "toppings_done == true"
          next_state: collect_quantity
      slot: "toppings"
      required: false
      guardrails:
        - "Call menu_lookup if toppings list needed"
        - "Max 3 toppings per pizza (business rule)"

    - name: collect_quantity
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "How many pizzas? (Enter number)"
      transitions:
        - condition: "quantity_captured == true AND quantity > 0"
          next_state: upsell
        - condition: "quantity_invalid == true"
          next_state: collect_quantity
      slot: "quantity"
      required: true

    # ===== UPSELL FLOW =====
    - name: upsell
      type: agent_turn
      agent: crust
      prompt_override: |
        Based on order so far, offer ONE relevant upsell:
        - If pizza ordered: "Want a side of wings or garlic bread?"
        - If no drinks: "How about a soda or bottled water?"
        - If no dessert: "Dessert? We've got brownies and cookies."
        Accept "no" gracefully. Do NOT repeat upsell if rejected.
        Persona at level 2.
      transitions:
        - condition: "upsell_accepted == true"
          next_state: collect_quantity  # Add item and quantity
        - condition: "upsell_rejected == true OR no_upsell_needed == true"
          next_state: read_back
      guardrails:
        - "Single upsell offer only; no repeat if declined"
        - "Keep it brief; don't delay order flow"

    # ===== CONFIRMATION FLOW =====
    - name: read_back
      type: agent_turn
      agent: crust
      prompt_override: |
        Read back the FULL order with itemized prices.
        Format:
          Order Summary:
          1 large hand-tossed pepperoni: $18.40
          + wings side: $7.99
          + 1 soda: $2.99
          Subtotal: $29.38
          Tax: $2.35
          **Total: $31.73**
        
        Call price_calc BEFORE responding with prices.
        Persona OFF; plain, crisp, capitalized.
      transitions:
        - condition: "read_back_complete == true"
          next_state: confirm_order
      guardrails:
        - "ALWAYS call price_calc before stating total"
        - "Itemize each line; show subtotal, tax, total clearly"
        - "Persona dialed DOWN to plain/professional"

    - name: confirm_order
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask for explicit confirmation: "Does this look right? Reply YES or NO to proceed."
        Wait for binary response.
      transitions:
        - condition: "confirmation == yes OR confirmation == true"
          next_state: collect_fulfillment
        - condition: "confirmation == no OR confirmation == false"
          next_state: modify_order
        - condition: "turn_count >= 3 AND no_clear_confirmation"
          next_state: end_escalation
          escalation_reason: "confirmation_stuck"
      guardrails:
        - "Accept only explicit yes/no"
        - "Do not proceed until clear confirmation"

    - name: modify_order
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "What would you like to change? (e.g., remove pepperoni, add wings, change size)"
        Route to appropriate collection state.
      transitions:
        - condition: "modify_quantity == true"
          next_state: collect_quantity
        - condition: "modify_toppings == true"
          next_state: collect_toppings
        - condition: "modify_size == true"
          next_state: collect_size
        - condition: "modification_complete == true"
          next_state: read_back
        - condition: "user_says_cancel == true"
          next_state: end_no_order

    # ===== FULFILLMENT FLOW =====
    - name: collect_fulfillment
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Pickup or delivery?"
      transitions:
        - condition: "fulfillment_type == pickup"
          next_state: collect_time
        - condition: "fulfillment_type == delivery"
          next_state: collect_delivery_address
      slot: "fulfillment_type"
      required: true

    - name: collect_delivery_address
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "What's your delivery address?"
        DO NOT STORE FULL ADDRESS IN CHAT.
        Store as reference ID only; get full address from external secure store.
      transitions:
        - condition: "address_captured == true"
          next_state: collect_time
      slot: "delivery_address_id"
      required: true
      guardrails:
        - "Never store full address inline in messages"
        - "Use reference ID / lookup from secure database"

    - name: collect_time
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "What time? (Enter time or 'ASAP' for default)"
        Default is 30 min from now for pickup, 45 min for delivery.
      transitions:
        - condition: "time_captured == true"
          next_state: collect_allergies
      slot: "fulfillment_time"
      required: true

    # ===== ALLERGEN FLOW =====
    - name: collect_allergies
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Any food allergies we should know about? (List them, or 'no')"
        If allergy mentioned:
          1. DO NOT declare any item "safe" or "allergen-free"
          2. Call allergen_lookup for ingredient data
          3. Disclose: "I can't guarantee against cross-contact — confirm with our kitchen/staff"
          4. Offer: human_handoff to talk with kitchen directly
        Persona OFF; plain, serious, crisp.
      transitions:
        - condition: "no_allergies == true"
          next_state: submit
        - condition: "allergies_collected == true"
          next_state: allergen_disclosure
        - condition: "allergy_escalation_needed == true"
          next_state: end_escalation
          escalation_reason: "allergen_uncertainty"
      guardrails:
        - "NEVER claim item is 'safe' or 'allergen-free'"
        - "ALWAYS call allergen_lookup on allergy mention"
        - "ALWAYS disclose cross-contact risk"
        - "ALWAYS offer human_handoff"
        - "This is a SAFETY CRITICAL state"

    - name: allergen_disclosure
      type: agent_turn
      agent: crust
      prompt_override: |
        Display allergen data from allergen_lookup.
        State: "I can't guarantee against cross-contact — please confirm with our kitchen/staff."
        Ask: "Would you like to talk to a staff member about allergies, or proceed with your order?"
      transitions:
        - condition: "want_human == true OR want_to_confirm == true"
          next_state: end_escalation
          escalation_reason: "allergen_uncertainty"
        - condition: "proceed_with_order == true"
          next_state: submit
      guardrails:
        - "Cross-contact disclosure is NON-NEGOTIABLE"
        - "If user hesitant, escalate to human"

    # ===== ORDER SUBMISSION =====
    - name: submit
      type: agent_turn
      agent: crust
      prompt_override: |
        Call order_submit with:
          order_id: (generate UUID if new, reuse if retry)
          customer_id: (from memory or create)
          items: (all pizzas, sides, drinks)
          fulfillment_type: (pickup or delivery)
          fulfillment_address: (reference ID for delivery)
          fulfillment_time: (ISO 8601 datetime)
          allergen_flags: (customer-stated allergies, for kitchen only)
        
        On SUCCESS: Respond with order number, pickup/delivery time, and confirmation.
        On FAILURE (retryable): Retry once with same order_id (idempotent).
        On FAILURE (terminal): Call human_handoff.
      transitions:
        - condition: "order_status == submitted"
          next_state: end_success
        - condition: "tool_error == retryable"
          next_state: submit  # Retry once (implicit idempotent retry via order_id)
        - condition: "tool_error == terminal"
          next_state: end_escalation
          escalation_reason: "order_submit_failure"
      guardrails:
        - "Never call order_submit without explicit confirmation"
        - "Use order_id as idempotency key"
        - "Validate all required slots before calling"

    # ===== ORDER STATUS CHECK =====
    - name: check_order_status
      type: agent_turn
      agent: crust
      prompt_override: |
        Ask: "Do you have an order number or your name/phone?"
        Call order_status to retrieve status.
        Display status, ETA, and next steps.
      transitions:
        - condition: "order_found == true"
          next_state: display_status
        - condition: "order_not_found == true"
          next_state: end_escalation
          escalation_reason: "order_lookup_failed"
      guardrails:
        - "Call order_status (idempotent GET)"
        - "If not found, escalate to human"

    - name: display_status
      type: agent_turn
      agent: crust
      prompt_override: |
        Display order status:
          Order #[number]: [status]
          Pickup/Delivery: [time]
          Items: [list]
          [Tracking link if available]
        Ask: "Anything else I can help with?"
      transitions:
        - condition: "user_wants_new_order == true"
          next_state: greet
        - condition: "user_needs_help == true"
          next_state: end_escalation
        - condition: "user_done == true"
          next_state: end_no_order

    # ===== TERMINAL STATES =====
    - name: end_success
      type: end
      description: "Order placed successfully"
      output: |
        Order confirmed!
        Order #[order_number]: [status]
        Pickup/Delivery: [time]
        Thank you for ordering. Enjoy your pizza. 🍕
      success_criteria: "order_id and order_number present in response"

    - name: end_escalation
      type: end
      description: "Escalated to human staff"
      output: |
        A staff member will help you shortly.
        [If distress]: If you're going through something serious, please reach out to a trained person — 
                       in the US you can call or text 988 (Suicide & Crisis Lifeline) anytime.
      escalation_captured: "reason, context, priority"

    - name: end_no_order
      type: end
      description: "User chose not to order"
      output: |
        No problem! Feel free to come back anytime. 🍕
        [If emo persona]: we'll be here, melancholy as ever.

  # Convergence Guarantee (All Paths Lead to Terminal State)
  convergence_guarantee:
    - "All states have transitions to terminal state or loop to prior state with guardrail (e.g., retry once, then escalate)"
    - "No infinite loops; max 15 turns before auto-escalate"
    - "At least 3 exit points per state (proceed, exit, escalate)"
    - "Every error is either retried once (idempotent) or escalated to human"

  # No Loops Verification
  no_loops_rules:
    - "Self-transitions only allowed in collect_* states with explicit 'add another' logic"
    - "Topping loop (collect_toppings → collect_toppings) has explicit exit condition"
    - "Modification loop (modify → specific collect state → read_back) advances forward after modification"
    - "No while/for loops; all control flow is if/then/else state transitions"

  # Idempotence Rules
  idempotence_rules:
    - "menu_lookup: GET; safe to call multiple times"
    - "allergen_lookup: GET; safe to call multiple times"
    - "price_calc: Deterministic computation; same inputs → same output"
    - "order_submit: POST with order_id key; retry with same ID returns same result, no double-charge"
    - "order_status: GET; safe to call multiple times"
    - "human_handoff: Creates ticket (fire-and-forget); retry is idempotent"

  # Immutability Rules
  immutability_rules:
    - "Order object never mutated in-place; transformations create new version"
    - "Each state transition creates new order state with incremented version"
    - "Slot values collected in thread are immutable snapshots (thread messages are append-only)"
    - "Allergen flags are immutable once set; create new allergen record for updates"
